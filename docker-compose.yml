# =============================================================================
# Manganer - docker-compose.yml
# Configurable vía .env - Seguro para GitHub
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API + Frontend (FastAPI + React estático)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Usa variable con fallback seguro
      - "${API_PORT:-8000}:8000"
    environment:
      # === Conexiones internas (NO cambiar) ===
      - DB_URL=sqlite:///./data/manganer.db
      - REDIS_URL=redis://redis:6379/0
      
      # === Rutas DENTRO del contenedor (NO cambiar) ===
      - DATA_DIR=/app/data
      - LIBRARY_DIR=/app/library
      - STATIC_DIR=/app/static
      
      # === Configuración escalable (desde .env) ===
      - WORKERS=${WORKERS:-4}
      - DEBUG=${DEBUG:-false}
      - DEFAULT_LANG=${DEFAULT_LANG:-es}
      
      # === API Keys (desde .env, vacías por defecto = seguro) ===
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - ANILIST_CLIENT_ID=${ANILIST_CLIENT_ID:-}
      - MAL_CLIENT_ID=${MAL_CLIENT_ID:-}
      - MAL_CLIENT_SECRET=${MAL_CLIENT_SECRET:-}
      
      # === OPDS (catálogo para lectores) ===
      - OPDS_PUBLIC=${OPDS_PUBLIC:-true}
      - OPDS_RATE_LIMIT_PER_IP=${OPDS_RATE_LIMIT_PER_IP:-60}
      
      # === Autenticación OPDS (opcional, desde .env) ===
      - OPDS_BASIC_AUTH_USER=${OPDS_BASIC_AUTH_USER:-}
      - OPDS_BASIC_AUTH_PASSWORD=${OPDS_BASIC_AUTH_PASSWORD:-}
    volumes:
      # === Volúmenes: rutas locales desde .env, rutas internas fijas ===
      # 🔧 Los usuarios personalizan DATA_PATH, LIBRARY_PATH, etc. en su .env
      - ${DATA_PATH:-./data}:/app/data
      - ${LIBRARY_PATH:-./library}:/app/library
      - ${STATIC_PATH:-./app/static}:/app/static
      - ${LOGS_PATH:-./logs}:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1.5G}

  # ---------------------------------------------------------------------------
  # Worker Celery (Tareas en background: escaneo, hashing, metadatos)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A app.core.celery_app worker
      --loglevel=${CELERY_LOGLEVEL:-info}
      --concurrency=${WORKERS:-4}
      --pool=prefork
    environment:
      # === Mismas conexiones que API ===
      - DB_URL=sqlite:///./data/manganer.db
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/app/data
      - LIBRARY_DIR=/app/library
      # === API Keys para tareas de metadatos/traducción ===
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - ANILIST_CLIENT_ID=${ANILIST_CLIENT_ID:-}
      - MAL_CLIENT_ID=${MAL_CLIENT_ID:-}
      - MAL_CLIENT_SECRET=${MAL_CLIENT_SECRET:-}
    volumes:
      # === Mismos volúmenes que API (necesita leer/escribir) ===
      - ${DATA_PATH:-./data}:/app/data
      - ${LIBRARY_PATH:-./library}:/app/library
      - ${STATIC_PATH:-./app/static}:/app/static
      - ${LOGS_PATH:-./logs}:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-1.5G}

  # ---------------------------------------------------------------------------
  # Redis (Broker de mensajes + Caché)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      # Volumen nombrado para persistencia (no depende de ruta local)
      - redis_/data
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-512M}

# =============================================================================
# Volúmenes nombrados (persisten entre docker compose down/up)
# =============================================================================
volumes:
  redis_